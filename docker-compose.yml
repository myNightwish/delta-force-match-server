version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/matchdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
    volumes:
      - ./uploads:/srv/uploads
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: arq app.worker.tasks.WorkerSettings
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/matchdb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./uploads:/srv/uploads
    depends_on:
      - db
      - redis

volumes:
  pgdata:
