# Current single-instance SQLite matching API. The host port is local-only.
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:8011:8000"
    environment:
      APP_ENV: production
      ENABLE_LEGACY_API: "false"
      PILOT_DB: /var/data/pilot.db
      PILOT_FREE_MODE: "true"
      PILOT_EXPERIMENT_MODE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5188,http://localhost:5188}
      PILOT_METRICS_TOKEN: ${PILOT_METRICS_TOKEN:-}
    volumes:
      - pilot-data:/var/data
    restart: unless-stopped
volumes:
  pilot-data:
